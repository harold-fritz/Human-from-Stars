# =============================================================================
# nginx para servir la web estática de "Humano de Estrellas".
# nginx config serving the "Human from Stars" static site.
# =============================================================================

server {
    # Sólo IPv4: hay hosts de Docker con IPv6 deshabilitado, y un
    # `listen [::]:80` fijo haría que nginx no arrancara en ellos. La imagen
    # oficial de nginx añade la línea IPv6 por su cuenta cuando el sistema la
    # soporta (script 10-listen-on-ipv6-by-default.sh).
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # No anunciar la versión de nginx.
    server_tokens off;

    # ------------------------------------------------------------ compresión --
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # -------------------------------------------------------------------- caché --
    # Los assets llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # El HTML nunca se cachea, para que un despliegue nuevo se vea al instante.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
    }

    # ------------------------------------------------------------------- rutas --
    # La página es de una sola vista, pero el fallback deja que ?lang= y
    # cualquier ruta futura sigan devolviendo la aplicación.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Página de error: devolvemos la propia aplicación.
    error_page 404 /index.html;
}
