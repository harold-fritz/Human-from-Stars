# Cabeceras de seguridad comunes.
#
# Van en un fichero aparte porque nginx NO hereda las directivas `add_header`
# de un bloque padre en cuanto el hijo declara la suya: cada `location` que
# añada una cabecera propia debe volver a incluir éstas o las perdería.
#
# Common security headers. They live in their own file because nginx does NOT
# inherit `add_header` from a parent block once the child declares one of its
# own: every `location` that adds a header must include these again or it
# would silently drop them.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
